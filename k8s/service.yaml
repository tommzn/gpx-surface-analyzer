apiVersion: v1
kind: Service
metadata:
  name: gpx-surface-mcp
  labels:
    app: gpx-surface-mcp
spec:
  # NodePort statt ClusterIP/LoadBalancer: kein MetalLB oder Ingress-Controller
  # noetig, einfach erreichbar ueber <IP-eines-beliebigen-Node>:30800 -
  # passt fuer ein privates Heimnetz-Cluster ohne externe Erreichbarkeit.
  type: NodePort
  selector:
    app: gpx-surface-mcp
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30800
      protocol: TCP
