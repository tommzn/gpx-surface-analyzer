name: Build and publish MCP server image

# Baut das mcp-server/-Image (inkl. core/, siehe .dockerignore) und pusht es
# nach ghcr.io. Auf Pull Requests wird nur gebaut (Validierung), damit
# fremde/unreviewte PRs keine Images unter unserem Namen veroeffentlichen
# koennen. Gepusht wird nur auf main und bei Tags.
#
# Ziel-Deployment ist ein privates k3s-Cluster auf Raspberry Pi (arm64,
# siehe k8s/deployment.yaml), das Image wird deshalb fuer linux/arm64
# gebaut. linux/amd64 wird zusaetzlich gebaut, um lokales Testen auf
# x86-Rechnern zu ermoeglichen.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "claude-skill/scripts/core/**"
      - "mcp-server/**"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "claude-skill/scripts/core/**"
      - "mcp-server/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gpx-surface-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (fuer arm64-Build auf x86-Runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker-Metadaten (Tags/Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build (und Push auf main/Tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp-server/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
